[project]
name = "woodmood-social"
version = "0.1.0"
description = "Woodmood project discovery and social publishing preparation"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<14",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
